services:
  # ─── Backend ──────────────────────────────────────────────
  - type: web
    name: idps-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
      apt-get install -y tesseract-ocr 2>/dev/null || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./idps.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://idps-frontend.vercel.app"]'
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
